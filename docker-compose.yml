services:
  wordpress-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: wordpress-mcp-server:local
    container_name: wordpress-mcp-server
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
